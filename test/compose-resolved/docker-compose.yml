# ===========================================================================
# Apprise API for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : linuxserver/apprise-api:2.1.0 (Docker Hub, used unmodified)
#                  -> https://github.com/caronc/apprise-api
#
# Ports   : host 8108 -> container 8000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/apprisedocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# Auth    : the web interface stores third-party credentials, so HTTP Basic
#           Auth is enabled (APPRISE_AUTH_REQUIRED=yes). Upstream ships no
#           built-in account; the small wrapper below creates a random
#           administrator password in /config/admin-credentials.txt on first
#           start, reuses it afterwards and then runs the image's own /init.
#           Unauthenticated requests get 401; the healthcheck only needs a
#           reply from port 8000, not a 200.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  apprisedocker:
    image: linuxserver/apprise-api:2.1.0
    container_name: apprisedocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # Apprise API stores notification credentials (bot tokens, SMTP passwords,
        # webhook URLs) in /config, so its web interface must not be open to every host
        # on the LAN. Upstream enables HTTP Basic Auth with APPRISE_AUTH_REQUIRED, but
        # it has no built-in account: an administrator password must be supplied.
        #
        # TOS users cannot pass environment variables to a package, so on the first
        # start this wrapper generates a random administrator password, keeps it in
        # /config (owner-only, uid 1000), reuses it on every later start and then hands
        # over to the image's own /init.
        set -u

        CRED=/config/admin-credentials.txt

        # The installer creates /config for uid 1000; make sure it exists anyway when
        # the container is started by hand.
        mkdir -p /config

        if [ ! -s "$$CRED" ]; then
            umask 077
            PASSWORD=$$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
            {
                printf 'Apprise API web interface - administrator login\n'
                printf 'username: %s\n' admin
                printf '%s: %s\n' password "$$PASSWORD"
                printf '\nDelete this file and restart the application to generate a new\n'
                printf 'password. Keep it: anyone with these credentials can read and\n'
                printf 'change every saved notification destination.\n'
            } > "$$CRED"
            chmod 600 "$$CRED"
        fi

        APPRISE_PASSWORD=$$(awk -F': ' '$$1 == "password" {print $$2; exit}' "$$CRED")
        if [ -z "$$APPRISE_PASSWORD" ]; then
            echo "apprisedocker: cannot read the administrator password from $$CRED" >&2
            exit 1
        fi

        export APPRISE_AUTH_REQUIRED=yes
        export APPRISE_USER=admin
        export APPRISE_PASSWORD

        echo "apprisedocker: HTTP Basic Auth is enabled (user 'admin')."
        echo "apprisedocker: the password is stored in $$CRED inside the container"
        echo "apprisedocker: (/Volume1/DockerAppData/apprisedocker/config/admin-credentials.txt on the NAS)."

        exec /init
    ports:
      - "8108:8000"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/apprisedocker/config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8108
    protocol: http
